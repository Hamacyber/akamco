name: Deploy to Azure App Service

on:
  push:
    branches: [main, master, production]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run linting (optional)
        run: npm run lint || true
        continue-on-error: true

      - name: Build Next.js application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify build output - Check .next directory
        run: |
          echo "=== Checking .next/server/font-manifest.json ==="
          test -f .next/server/font-manifest.json && echo "✓ font-manifest.json EXISTS" || echo "✗ font-manifest.json MISSING"
          echo ""
          echo "=== Contents of .next/server ==="
          ls -la .next/server/ | head -20
          echo ""
          echo "=== Contents of .next ==="
          ls -la .next/ | head -20
          echo ""
          echo "=== .next directory size ==="
          du -sh .next

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            .next
            public
            src
            package.json
            package-lock.json
            next.config.js
            tsconfig.json
            .env.production
            node_modules
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Verify artifact contents - Check .next directory
        run: |
          echo "=== Checking .next/server/font-manifest.json in artifact ==="
          test -f .next/server/font-manifest.json && echo "✓ font-manifest.json EXISTS in artifact" || echo "✗ font-manifest.json MISSING in artifact"
          echo ""
          echo "=== Contents of .next/server in artifact ==="
          ls -la .next/server/ | head -20
          echo ""
          echo "=== Working directory structure ==="
          ls -la | grep -E "^\." 
          echo ""
          echo "=== .next directory size in artifact ==="
          du -sh .next

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_59BA7BADE6614468AD773A142021BEED }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_92889C17779741F9B2F4ACF43D06EFDF }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_596D86DBDCA048599B91E409327AC8B3 }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'akamco-webapp2'
          slot-name: 'Production'
          package: .

      - name: Notify deployment success
        if: success()
        run: echo "✅ Successfully deployed to Azure!"

      - name: Notify deployment failure
        if: failure()
        run: echo "❌ Deployment failed. Check logs above."
